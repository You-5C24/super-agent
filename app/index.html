<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 编辑器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .editor-panel, .preview-panel {
            flex: 1;
            padding: 20px;
            overflow: auto;
        }
        
        .editor-panel {
            border-right: 1px solid #e0e0e0;
        }
        
        .panel-title {
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        textarea {
            width: 100%;
            height: calc(100% - 40px);
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
        }
        
        .preview-content {
            width: 100%;
            height: calc(100% - 40px);
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            overflow-y: auto;
        }
        
        /* Markdown 样式 */
        .preview-content h1 { font-size: 2em; margin: 0.67em 0; }
        .preview-content h2 { font-size: 1.5em; margin: 0.83em 0; }
        .preview-content h3 { font-size: 1.17em; margin: 1em 0; }
        .preview-content p { margin: 1em 0; line-height: 1.6; }
        .preview-content ul, .preview-content ol { margin: 1em 0; padding-left: 2em; }
        .preview-content li { margin: 0.5em 0; }
        .preview-content code { 
            background: #f4f4f4; 
            padding: 2px 4px; 
            border-radius: 3px; 
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }
        .preview-content pre > code {
            display: block;
            padding: 10px;
            background: #f4f4f4;
            overflow-x: auto;
        }
        .preview-content a { color: #007bff; text-decoration: none; }
        .preview-content a:hover { text-decoration: underline; }
        .preview-content img { max-width: 100%; height: auto; }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .editor-panel, .preview-panel {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor-panel">
            <div class="panel-title">编辑区</div>
            <textarea id="markdown-input" placeholder="在这里输入 Markdown 内容...\n\n# 标题\n\n这是段落文本。\n\n- 列表项1\n- 列表项2\n\n\`代码块\`"></textarea>
        </div>
        <div class="preview-panel">
            <div class="panel-title">预览区</div>
            <div id="preview-output" class="preview-content">
                <p>预览内容将显示在这里...</p>
            </div>
        </div>
    </div>

    <script>
        // 简单的 Markdown 解析器（支持基本语法）
        function markdownToHtml(md) {
            if (!md) return '';
            
            // 转义 HTML 特殊字符
            let html = md
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/'/g, '&#39;')
                .replace(/"/g, '&quot;');
            
            // 标题
            html = html.replace(/^#{1,6} (.+)$/gm, '<h$1>$2</h$1>');
            
            // 加粗和斜体
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
            html = html.replace(/_(.*?)_/g, '<em>$1</em>');
            
            // 链接 [text](url)
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
            
            // 图片 ![alt](url)
            html = html.replace(/!\[([^\]]+)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
            
            // 代码块
            html = html.replace(/```([\s\S]*?)```/gm, '<pre><code>$1</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // 列表
            html = html.replace(/^\s*- (.+)$/gm, '<li>$1</li>');
            html = html.replace(/<li>(.+)<\/li>/g, '<ul><li>$1</li></ul>');
            
            // 段落
            html = html.replace(/^(?!<h|<ul|<ol|<pre|<code)(.+)$/gm, '<p>$1</p>');
            
            // 换行
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }
        
        // 初始化
        const input = document.getElementById('markdown-input');
        const output = document.getElementById('preview-output');
        
        // 实时更新预览
        input.addEventListener('input', function() {
            output.innerHTML = markdownToHtml(input.value);
        });
        
        // 初始化预览
        output.innerHTML = markdownToHtml(input.value);
    </script>
</body>
</html>
